[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sp-services"
version = "0.1.0"
description = "Async Python client for SP Services electricity and water usage"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["niquests>=3.15.2"]
authors = [{ name = "Kianhean" }]
keywords = ["sp-services", "energy", "water", "otp", "singapore"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.scripts]
sp-services-demo = "sp_services.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

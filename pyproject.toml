[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sp-services"
version = "0.1.0"
description = "Async Python client for SP Services electricity and water usage"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["niquests>=3.15.2"]
authors = [{ name = "Kianhean" }]
keywords = ["sp-services", "energy", "water", "otp", "singapore"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/kianhean/sp_api"
Repository = "https://github.com/kianhean/sp_api"
Issues = "https://github.com/kianhean/sp_api/issues"

[project.scripts]
sp-services-demo = "sp_services.cli:main"
sp-services-e2e = "sp_services.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=1.3.0",
  "ruff>=0.8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
